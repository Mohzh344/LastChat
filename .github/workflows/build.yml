name: Build APK

on:
  push:
    branches: [ main, master, feature ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web UI
        run: |
          cd web-ui
          npm install
          npm run build

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'GSJSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "lastchat.rikkafork.cocolal.plus"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_key"}],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          GSJSON

      - name: Build Release APK
        run: ./gradlew assemblePlusRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LastChat-RTL-Release
          path: app/build/outputs/apk/plus/release/*.apk
