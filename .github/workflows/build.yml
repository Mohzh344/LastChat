name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web UI
        run: |
          cd web-ui
          npm install
          npm run build

      - name: Build Release APK
        run: ./gradlew assemblePlusRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LastChat-RTL-Release
          path: app/build/outputs/apk/plus/release/*.apk
